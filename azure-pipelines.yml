# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool: windows-agent-sonal

jobs:
- job: TerraformInitPlan
  displayName: yaha pe ham init chalayenge
  steps:
  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'init'
      backendServiceArm: 'newasr'
      backendAzureRmResourceGroupName: 'for-backend'
      backendAzureRmStorageAccountName: 'pipelinekeliye'
      backendAzureRmContainerName: 'pipestorage'
      backendAzureRmKey: 'dev12.state'