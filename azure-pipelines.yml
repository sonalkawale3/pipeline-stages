

trigger:
- main

pool: windows-agent-sonal

stages:
- stage: Initstage
  jobs:
  - job: TerraformInitPlan
    displayName: to bhai yaha pe init chalega
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'newasr'
        backendAzureRmResourceGroupName: 'for-backend'
        backendAzureRmStorageAccountName: 'pipelinekeliye'
        backendAzureRmContainerName: 'pipestorage'
        backendAzureRmKey: 'dev12.state'
       

- stage: Scanningstage
  jobs:
  - job: Tfsec
    displayName: to bhai yaha pe scan hoga
    steps:
    - task: tfsec@1
      inputs:
        version: 'v1.26.0'

- stage: TerraformInit
  jobs:
  - job: TerraformpInit
    displayName: to bhai yaha pe Init chalega
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'newasr'
        backendAzureRmResourceGroupName: 'for-backend'
        backendAzureRmStorageAccountName: 'pipelinekeliye'
        backendAzureRmContainerName: 'pipestorage'
        backendAzureRmKey: 'dev12.state'
    
